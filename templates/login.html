<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CityCare Laboratory</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="logo">LB</div>
        <div>
          <h1>CityCare Laboratory</h1>
          <p>Hospital Diagnostics &middot; Secure Access</p>
        </div>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-wrap">
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('login', next=request.args.get('next', '')) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" autocomplete="username" required autofocus
                 placeholder="Enter username">
        </div>
        <div class="form-group" style="margin-top:14px;">
          <label>Password</label>
          <input type="password" name="password" autocomplete="current-password" required
                 placeholder="Enter password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;">Sign In</button>
      </form>

      <div class="auth-foot">
        <span class="auth-lock">&#128274;</span> Protected system &middot; authorised users only
      </div>
    </div>
  </div>
</body>
</html>
